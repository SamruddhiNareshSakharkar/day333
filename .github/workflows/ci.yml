name: CI

on:
  push:
    
jobs :
  test :
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --upgrade pip
             pip install pylint

      - name: Run linter
        run: pylint calculator.py test_calculator.py || true
          
          
      - name: Run Tests
        run: pytest
        continue-on-error: true
      
      - name : pylint
        run : pylint calculator.py test_calculator.py || TRUE

     
        